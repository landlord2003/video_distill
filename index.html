<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crawl4ai 本地采集器</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;
        --txt:#e6e9ef;--mut:#8b93a3;--acc:#4f9dff;--acc2:#2bd4a4;--red:#ff5f6e;
        --amber:#e8b64c;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
  #app{display:flex;height:100vh}
  /* ===== 左侧栏（网页抓取历史） ===== */
  #side{width:280px;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;flex-shrink:0}
  #side h2{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);
           display:flex;align-items:center;gap:8px}
  #side h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
  #search{padding:10px 12px;border-bottom:1px solid var(--line)}
  #search input{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);
                border-radius:6px;color:var(--txt);outline:none}
  #search input:focus{border-color:var(--acc)}
  #hist{flex:1;overflow:auto}
  .item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:var(--panel2)}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .u{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m{color:var(--mut);font-size:11px;margin-top:3px;display:flex;justify-content:space-between}
  .item .st{font-size:11px}
  .st{font-size:11px}
  .st.done{color:var(--acc2)} .st.error{color:var(--red)} .st.running{color:var(--acc)}
  .empty{color:var(--mut);padding:20px;text-align:center}
  /* ===== 主区通用 ===== */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #tabs{padding:10px 18px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .tab{background:var(--panel2);border:1px solid var(--line);border-bottom:none;color:var(--mut);
       border-radius:8px 8px 0 0;padding:8px 18px;cursor:pointer;font-size:13px}
  .tab.active{background:var(--bg);color:var(--txt);border-bottom:1px solid var(--bg);margin-bottom:-1px}
  .ver{margin-left:auto;color:var(--mut);font-size:11px;padding-bottom:8px}
  #bar{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);
       display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #url{flex:1;min-width:260px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
       border-radius:8px;color:var(--txt);outline:none;font-size:14px}
  #url:focus{border-color:var(--acc)}
  #go{padding:10px 20px;background:var(--acc);color:#fff;border:none;border-radius:8px;
      cursor:pointer;font-weight:600}
  #go:disabled{opacity:.5;cursor:default}
  .toggle{display:flex;align-items:center;gap:6px;color:var(--mut);user-select:none}
  #status{padding:8px 18px;color:var(--mut);font-size:12px;min-height:18px}
  #result{flex:1;overflow:auto;padding:0 18px 18px}
  #rtitle{font-size:16px;font-weight:700;margin:10px 0 4px}
  #rmeta{color:var(--mut);font-size:12px;margin-bottom:10px}
  /* Markdown 渲染区 */
  #md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;
      line-height:1.7;font-size:14px}
  #md.md-raw{white-space:pre-wrap;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
            font-size:13px}
  .md-body>:first-child{margin-top:0}
  .md-body h1,.md-body h2,.md-body h3,.md-body h4{line-height:1.3;margin:1.1em 0 .5em;font-weight:700}
  .md-body h1{font-size:1.6em;border-bottom:1px solid var(--line);padding-bottom:.3em}
  .md-body h2{font-size:1.35em;border-bottom:1px solid var(--line);padding-bottom:.25em}
  .md-body h3{font-size:1.15em}
  .md-body p{margin:.7em 0}
  .md-body a{color:var(--acc);text-decoration:none}
  .md-body a:hover{text-decoration:underline}
  .md-body img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);
              margin:.3em 0;display:block}
  .md-body ul,.md-body ol{padding-left:1.6em;margin:.6em 0}
  .md-body li{margin:.25em 0}
  .md-body blockquote{margin:.7em 0;padding:.4em 1em;border-left:3px solid var(--acc);
                     color:var(--mut);background:var(--panel2)}
  .md-body code{background:var(--panel2);padding:.15em .4em;border-radius:4px;font-size:.9em;
               font-family:"SFMono-Regular",Consolas,monospace}
  .md-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;
              overflow:auto}
  .md-body pre code{background:none;padding:0}
  .md-body table{border-collapse:collapse;margin:.7em 0;width:100%}
  .md-body th,.md-body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .md-body hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}
  .md-body .nav-junk{opacity:.55;font-size:.85em}
  pre.json{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;
           overflow:auto;font-size:12px;color:var(--acc2)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;
       padding:5px 12px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--acc)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.del{color:var(--red);border-color:transparent}
  .btn.del:hover{border-color:var(--red)}
  .delwrap{margin-top:6px;text-align:right}
  .row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);
           border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* chips */
  .chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;
        background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
  .chip.ok{color:var(--acc2);border-color:rgba(43,212,164,.4)}
  .chip.err{color:var(--red);border-color:rgba(255,95,110,.4)}
  .chip.run{color:var(--acc);border-color:rgba(79,157,255,.4)}
  /* ===== 方案A：视频工作台 左右分栏 ===== */
  #video-panel{display:none;flex-direction:column;overflow:hidden;flex:1}
  .layoutA{flex:1;display:flex;min-height:0}
  #vsplit{width:6px;cursor:col-resize;flex-shrink:0;border-left:1px solid var(--line)}
  #vsplit:hover,#vsplit.dragging{background:var(--acc)}
  /* 模态弹窗（编辑记录/管理分类） */
  .mback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;
         align-items:center;justify-content:center}
  .mback.show{display:flex}
  .mpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:18px;width:440px;max-width:92vw;max-height:82vh;overflow:auto}
  .mpanel h3{margin:0 0 12px;font-size:15px}
  .mpanel label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
  .catrow{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .flow{width:400px;flex-shrink:0;border-right:1px solid var(--line);overflow:auto;padding:14px;
        display:flex;flex-direction:column;gap:12px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
  .step-h{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .step-h:hover{background:var(--panel2)}
  .step-h .no{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;
              font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step-h .tt{font-weight:700;font-size:13px}
  .step-h .sub{margin-left:auto;color:var(--mut);font-size:11px}
  .step-b{padding:12px 14px 14px;border-top:1px solid var(--line)}
  .step.folded .step-b{display:none}
  .step.folded .no{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
       padding:3px;gap:3px;margin-bottom:10px}
  .seg button{flex:1;border:none;background:transparent;color:var(--mut);padding:5px;border-radius:6px;
              cursor:pointer;font-size:12px}
  .seg button.on{background:var(--acc);color:#fff;font-weight:600}
  .segbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .vhealth{color:var(--mut);font-size:11px;text-align:center;padding:2px 0 8px}
  .work{flex:1;min-width:0;display:flex;flex-direction:column}
  .work-tabs{display:flex;padding:10px 18px 0;border-bottom:1px solid var(--line);align-items:center;flex-shrink:0}
  .wtab{padding:8px 18px;cursor:pointer;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;
        display:flex;align-items:center;gap:8px}
  .wtab.active{color:var(--txt);border-bottom-color:var(--acc);font-weight:700}
  .work-body{flex:1;overflow:auto;padding:14px 18px}
  .wpane{display:none}
  .wpane.active{display:block}
  .kpi{display:flex;gap:22px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
       background:var(--panel);margin-bottom:10px}
  .kpi .k{font-size:11px;color:var(--mut)}
  .kpi .v{font-size:18px;font-weight:700}
  .kpi .v.ok{color:var(--acc2)} .kpi .v.err{color:var(--red)}
  /* 产出卡片（结果与记录共用） */
  .vcard{padding:0;border:1px solid var(--line);border-radius:10px;margin:0 0 12px;
         background:var(--panel);overflow:hidden}
  .vcard .mut{color:var(--mut);font-size:12px}
  .vcard-h{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .vcard-h>div:first-child{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vcard-b{border-top:1px solid var(--line);padding:12px 16px}
  .rec{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .rec:hover{background:var(--panel2)}
  .rec .ic{width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .rec .bd{min-width:0;flex:1}
  .rec .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .rec .u{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .sp{flex-shrink:0;display:flex;gap:6px;align-items:center}
  #vurls{width:100%;height:110px;background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;color:var(--txt);padding:10px;outline:none;resize:vertical;font-size:13px}
  #vurls:focus{border-color:var(--acc)}
  #vprofile{flex:1;min-width:0;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;color:var(--txt);outline:none;font-size:13px}
  #vprofile:focus{border-color:var(--acc)}
  select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);
         padding:8px;outline:none;font-size:13px}
  @media(max-width:960px){.flow{width:320px}}
</style>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="side">
    <h2><span class="dot"></span>抓取历史</h2>
    <div id="search"><input id="q" placeholder="搜索 URL / 标题…" oninput="loadHist()"></div>
    <div id="hist"><div class="empty">暂无记录</div></div>
  </aside>
  <main id="main">
    <div id="tabs">
      <button class="tab active" onclick="switchTab('web',this)">🌐 网页抓取</button>
      <button class="tab" onclick="switchTab('video',this)">🎬 视频号/抖音</button>
      <span class="ver">v3.3 · 工作台布局 · 双语字幕✓ · 记录管理✓</span>
    </div>
    <!-- 网页抓取（保持原有结构） -->
    <div id="bar">
      <input id="url" placeholder="输入要抓取的网址，如 https://www.ehang.com/" onkeydown="if(event.key==='Enter')crawl()">
      <label class="toggle"><input type="checkbox" id="llm"> 结构化抽取(本地Ollama)</label>
      <button id="go" onclick="crawl()">抓取</button>
    </div>
    <div id="status">就绪</div>
    <div id="result">
      <div class="empty" style="color:var(--mut);padding:40px;text-align:center">
        输入网址点击「抓取」，结果 Markdown 会显示在这里并自动存入历史。
      </div>
    </div>
    <!-- 视频工作台：左操作流 / 右产出区 -->
    <div id="video-panel">
      <div class="layoutA">
        <!-- 左：操作流 -->
        <div class="flow" id="vflow">
          <div class="step" id="vst1">
            <div class="step-h" onclick="fold('vst1')"><span class="no">1</span><span class="tt">添加视频</span>
              <span class="sub">抖音号 / 本地文件</span></div>
            <div class="step-b">
              <div class="seg">
                <button class="on" onclick="seg1(this,'p1a')">🔍 抖音号采集</button>
                <button onclick="seg1(this,'p1c')">📁 本地文件</button>
              </div>
              <div id="p1a">
                <div style="display:flex;gap:6px">
                  <input id="vprofile" placeholder="粘贴对方主页链接（douyin.com/user/… 或分享短链）" onkeydown="if(event.key==='Enter')collectProfile()">
                  <select id="vpcount" style="flex-shrink:0">
                    <option value="50" selected>前 50 条</option>
                    <option value="100">前 100 条</option>
                    <option value="200">前 200 条</option>
                    <option value="0">全部作品</option>
                  </select>
                  <button id="vpg" class="btn pri" onclick="collectProfile()" style="flex-shrink:0">🔍 采集</button>
                </div>
                <div id="vpstatus" class="mut" style="margin-top:6px">采集该账号的视频清单，勾选后填入 ② 待处理清单</div>
                <div id="vplist" style="margin-top:8px"></div>
              </div>
              <div id="p1c" style="display:none">
                <input type="file" id="vfiles" multiple accept="video/*" style="width:100%">
                <div class="mut" style="margin-top:6px">视频号视频：手机保存 → 微信传输助手 → 此处上传</div>
              </div>
            </div>
          </div>
          <div class="step" id="vst2">
            <div class="step-h" onclick="fold('vst2')"><span class="no">2</span><span class="tt">待处理清单</span>
              <span class="sub" id="v2sub">粘贴直链，每行一个</span></div>
            <div class="step-b">
              <textarea id="vurls" placeholder="粘贴抖音 / 视频号直链，每行一个（支持批量清单，一次处理 N 条）&#10;例：https://v.douyin.com/xxxx&#10;https://.../xxx.m3u8" oninput="v2count()"></textarea>
              <div class="segbtns">
                <label class="toggle"><input type="checkbox" id="vvault" checked> 写入 Obsidian 库 (Claw/07-视频号整理)</label>
                <label class="toggle" title="英文等外语视频：保留原文并逐段对照中文翻译（本地模型翻译）"><input type="checkbox" id="vbilingual"> 🔤 双语字幕对照</label>
                <label class="toggle" title="只抽视频开头一帧作配图，不做全片抽帧"><input type="checkbox" id="v1frame"> 🖼 只取首页一帧</label>
              </div>
              <div class="segbtns" style="margin-top:8px">
                <span style="flex:1"></span>
                <button id="vgo" class="btn pri" onclick="runVideo()" style="padding:8px 22px">▶ 运行整理</button>
              </div>
            </div>
          </div>
          <div class="step" id="vst3">
            <div class="step-h" onclick="fold('vst3')"><span class="no">3</span><span class="tt">处理进度</span>
              <span class="sub" id="v3sub">就绪</span></div>
            <div class="step-b">
              <div style="background:var(--panel2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:10px">
                <div id="vbar" style="width:0%;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s"></div>
              </div>
              <div id="vstatus" class="mut" style="line-height:1.9;min-height:20px">等待提交…</div>
            </div>
          </div>
          <div id="vhealth" class="vhealth">工具状态：检测中…</div>
          <div style="display:flex;justify-content:flex-end;margin-top:6px">
            <button class="btn" onclick="clearVideoAll()" title="清空链接清单、采集清单与处理进度（不影响已入库记录）">🧹 清空重置</button>
          </div>
        </div>
        <div id="vsplit" title="拖动调整宽度"></div>
        <!-- 右：产出区 -->
        <div class="work">
          <div class="work-tabs">
            <div class="wtab active" id="wt-res" onclick="wtab('wresult',this)">✨ 整理结果 <span class="chip run" id="vres-count" style="display:none"></span></div>
            <div class="wtab" id="wt-hist" onclick="wtab('whist',this)">📚 已入库记录 <span class="chip" id="vhist-status"></span></div>
          </div>
          <div class="work-body">
            <div id="wresult" class="wpane active">
              <div id="vresult"><div class="empty" style="padding:40px">批量整理的结果卡片会出现在这里。</div></div>
            </div>
            <div id="whist" class="wpane">
              <div class="kpi">
                <div><div class="k">累计入库</div><div class="v" id="vk-total">–</div></div>
                <div><div class="k">完成</div><div class="v ok" id="vk-done">–</div></div>
                <div><div class="k">失败</div><div class="v err" id="vk-err">–</div></div>
                <div><div class="k">总字数</div><div class="v" id="vk-chars">–</div></div>
              </div>
              <div id="vcats" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
              <input type="text" id="vhq" placeholder="🔍 搜索已入库记录（标题 / 来源）…" style="margin-bottom:10px" oninput="renderVhistList()">
              <div id="vh-detail"></div>
              <div id="vhist"><div class="empty" style="padding:14px">加载中…</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<!-- 通用模态弹窗 -->
<div id="mback" class="mback" onclick="if(event.target===this)hideModal()"><div class="mpanel" id="mpanel"></div></div>
<script>
const $ = s => document.querySelector(s);
async function loadHist(){
  const q = $('#q').value.trim();
  const r = await fetch('/api/history?q='+encodeURIComponent(q));
  const rows = await r.json();
  const box = $('#hist');
  if(!rows.length){ box.innerHTML='<div class="empty">暂无记录</div>'; return; }
  box.innerHTML = rows.map(x=>`
    <div class="item" onclick="view('${x.id}')">
      <div class="t">${esc(x.title||x.url)}</div>
      <div class="u">${esc(x.url)}</div>
      <div class="m"><span class="st ${x.status}">${stxt(x.status)}</span>
        <span>${x.created_at||''} · ${x.md_len||0}字</span></div>
      <div class="delwrap"><button class="btn del" onclick="event.stopPropagation();del('${x.id}')">删除</button></div>
    </div>`).join('');
}
function stxt(s){return s==='done'?'✓ 完成':s==='error'?'✗ 失败':s==='running'?'… 进行中':'·'}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escAttr(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showModal(html){ $('#mpanel').innerHTML = html; $('#mback').classList.add('show'); }
function hideModal(){ $('#mback').classList.remove('show'); }

// ---------- 拖拽调整左右栏宽度 ----------
(function(){
  const sp = document.getElementById('vsplit'), fl = document.getElementById('vflow');
  if(!sp || !fl) return;
  const saved = parseInt(localStorage.getItem('vflow_w')||'0',10);
  if(saved>=300 && saved<=700) fl.style.width = saved+'px';
  let drag = false;
  sp.addEventListener('mousedown', e=>{
    drag = true; sp.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!drag) return;
    const left = fl.getBoundingClientRect().left;
    const w = Math.min(700, Math.max(300, e.clientX - left - 3));
    fl.style.width = w + 'px';
  });
  document.addEventListener('mouseup', ()=>{
    if(!drag) return;
    drag = false; sp.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem('vflow_w', parseInt(fl.style.width,10)||400);
  });
})();

async function crawl(){
  const url = $('#url').value.trim();
  if(!url){ setStatus('请先输入网址'); return; }
  const go = $('#go'); go.disabled=true; go.textContent='抓取中';
  setStatus('<span class="spinner"></span> 正在抓取 '+url+' …（首次启动浏览器约数秒）');

      headers:{'Content-Type':'application/json'},

function render(d){

    <div id="rmeta">${esc(d.url)} · ${d.created_at||''} · ${(d.md_len||0)} 字

let _vhistRows = [];
let _vcatFilter = '';      // ''=全部 '__uncat__'=未分类 其他=分类名
let _catKeys = [];         // 当前分类名列表（避免内联onclick注入）
async function loadVideoHist(){
  const st = $('#vhist-status');
  st.textContent = '…';
  try{
    const r = await fetch('/api/video/history');
    const rows = await r.json();
    _vhistRows = rows || [];
    const done = _vhistRows.filter(x=>x.status==='done').length;
    const err  = _vhistRows.filter(x=>x.status==='error').length;
    const chars= _vhistRows.reduce((a,x)=>a+(x.md_len||0),0);
    $('#vk-total').textContent = _vhistRows.length;
    $('#vk-done').textContent  = done;
    $('#vk-err').textContent   = err;
    $('#vk-chars').textContent = chars>=10000 ? (chars/10000).toFixed(1)+'万' : chars;
    st.textContent = _vhistRows.length ? _vhistRows.length+' 条' : '';
    renderCatChips();
    renderVhistList();
  }catch(e){ st.textContent = '加载失败'; }
}
function catCounts(){
  const counts = {}; let uncat = 0;
  _vhistRows.forEach(x=>{
    const c = (x.category||'').trim();
    if(c) counts[c] = (counts[c]||0)+1; else uncat++;
  });
  return {counts, uncat, cats: Object.keys(counts).sort()};
}
function renderCatChips(){
  const {counts, uncat, cats} = catCounts();
  _catKeys = cats;
  const chips = [
    ['', '全部 '+_vhistRows.length],
    ['__uncat__', '未分类 '+uncat],
    ...cats.map(c=>[c, esc(c)+' '+counts[c]])
  ];
  $('#vcats').innerHTML = chips.map(([k,label],i)=>
    `<span class="chip ${_vcatFilter===k?'on':''}" style="cursor:pointer" onclick="_setCat('${escAttr(k)}')">${label}</span>`
  ).join('')
  + `<span class="chip" style="cursor:pointer;margin-left:auto" onclick="manageCats()">⚙ 管理分类</span>`;
}
function _setCat(k){ _vcatFilter = k; renderCatChips(); renderVhistList(); }
function renderVhistList(){
  const box = $('#vhist');
  const q = ($('#vhq') ? $('#vhq').value.trim().toLowerCase() : '');
  let rows = _vhistRows;
  if(_vcatFilter==='__uncat__') rows = rows.filter(x=>!((x.category||'').trim()));
  else if(_vcatFilter) rows = rows.filter(x=>((x.category||'').trim())===_vcatFilter);
  if(q) rows = rows.filter(x =>
    ((x.title||'')+' '+(x.source_url||'')+' '+(x.vault_path||'')).toLowerCase().includes(q));
  if(!rows.length){
    box.innerHTML = `<div class="empty" style="padding:14px">${q||_vcatFilter?'没有匹配的记录':'暂无视频整理记录'}</div>`;
    return;
  }
  box.innerHTML = `<div class="vcard" style="margin-bottom:24px">` + rows.map(x=>{
    const cat = (x.category||'').trim();
    return `
      <div class="rec" onclick="viewVideo('${x.id}')">
        <div class="ic">🎬</div>
        <div class="bd">
          <div class="t">${esc(x.title||x.source_url)} <span class="st ${x.status}">${stxt(x.status)}</span>
            ${cat?`<span class="chip">${esc(cat)}</span>`:''}</div>
          <div class="u">${esc(x.source_url||'')} · ${x.created_at||''} · ${x.md_len||0}字</div>
        </div>
        <div class="sp">
          <button class="btn" onclick="event.stopPropagation();editRec('${x.id}')">编辑</button>
          <button class="btn" onclick="event.stopPropagation();viewVideo('${x.id}')">查看</button>
          <button class="btn del" onclick="event.stopPropagation();delVideo('${x.id}','${escAttr(x.title||x.id)}')">删除</button>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

// 管理分类：重命名 / 删除（删除后记录回落未分类，记录本身不动）
function manageCats(){
  const {counts, cats} = catCounts();
  showModal(`<h3>⚙ 管理分类</h3>
    <div class="mut" style="margin-bottom:8px">删除分类不会删除记录，其中的记录将回落到「未分类」。新建分类请在某条记录的「编辑」里选「➕ 新建分类」。</div>
    ${cats.length ? cats.map((c,i)=>`
      <div class="catrow">
        <input type="text" id="mc-${i}" value="${escAttr(c)}" maxlength="30" style="flex:1">
        <span class="mut" style="flex-shrink:0">${counts[c]} 条</span>
        <button class="btn" onclick="renCat(${i})">重命名</button>
        <button class="btn del" onclick="delCat(${i})">删除</button>
      </div>`).join('')
    : '<div class="empty" style="padding:14px">还没有分类</div>'}
    <div style="display:flex;justify-content:flex-end;margin-top:14px">
      <button class="btn" onclick="hideModal()">关闭</button>
    </div>`);
}
async function renCat(i){
  const nv = document.getElementById('mc-'+i).value.trim();
  if(!nv){ alert('分类名不能为空'); return; }
  const old = _catKeys[i];
  try{
    const r = await fetch('/api/video/cats/rename', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({old, new:nv})});
    const d = await r.json();
    if(r.ok && d.ok){
      if(_vcatFilter===old) _vcatFilter = nv;
      hideModal();
      loadVideoHist();
    } else { alert('重命名失败：'+(d.error||r.status)); }
  }catch(e){ alert('异常：'+e.message); }
}
async function delCat(i){
  const old = _catKeys[i];
  const n = (_vhistRows.filter(x=>(x.category||'').trim()===old)).length;
  if(!confirm(`删除分类「${old}」？\n其中 ${n} 条记录将回落到「未分类」，记录本身不受影响。`)) return;
  try{
    const r = await fetch('/api/video/cats/'+encodeURIComponent(old), {method:'DELETE'});
    const d = await r.json();
    if(r.ok && d.ok){
      if(_vcatFilter===old) _vcatFilter='';
      hideModal();
      loadVideoHist();
    } else { alert('删除失败：'+(d.error||r.status)); }
  }catch(e){ alert('异常：'+e.message); }
}

}

async function runVideo(){
  const urls = $('#vurls').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const files = $('#vfiles').files;
  const wv = $('#vvault').checked;
  const go = $('#vgo'); go.disabled=true; go.textContent='处理中…';
  let results = [];
  const total = urls.length + files.length;
  const t0 = Date.now();
  let curT0 = t0;   // 当前这条的开始时刻（用于「本条用时」）
  showResultTab();
  setBar(total ? 2 : 0);
  // 每秒刷新：本条用时 + 总用时
  const timerId = setInterval(()=>{
    const tt = document.getElementById('vtotal-t'), it = document.getElementById('vitem-t');
    if(tt) tt.textContent = Math.round((Date.now()-t0)/1000) + ' 秒';
    if(it) it.textContent = Math.round((Date.now()-curT0)/1000) + ' 秒';
  }, 1000);
  const doneMsgs = [];
  try{
    // 逐条提交：每条链接一个请求，处理完立即渲染。
    // 好处：① 单条卡住/失败不影响其余；② 页面能看到第几条在处理；③ 服务端逐条入库。
    for(let i=0;i<urls.length;i++){
      go.textContent = `处理中 ${results.length+1}/${total}…`;
      curT0 = Date.now();
      setV3(`<b>正在处理第 ${i+1}/${urls.length} 条链接</b><br>
        ⏱ 本条 <span id="vitem-t">0 秒</span> · 总用时 <span id="vtotal-t">0 秒</span><br>
        <span style="font-size:11px">${esc(urls[i].slice(0,70))}</span>${doneMsgs.length?('<br>'+doneMsgs.join('<br>')):''}`);
      const itemT0 = Date.now();
      try{
        const r = await fetch('/api/video',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({urls:[urls[i]], write_vault:wv,
            bilingual:!!($('#vbilingual')&&$('#vbilingual').checked),
            first_frame:!!($('#v1frame')&&$('#v1frame').checked)})});
        const d = await r.json();
        results = results.concat(d.results || []);
      }catch(err){
        results.push({source_url:urls[i], ok:false, error:'请求失败: '+err.message, markdown:''});
      }
      const last = results[results.length-1] || {};
      const secs = Math.round((Date.now()-itemT0)/1000);
      doneMsgs.unshift(last.ok
        ? `✅ 第 ${i+1} 条完成（${secs} 秒）：${esc((last.title||'').slice(0,30))}`
        : `❌ 第 ${i+1} 条失败（${secs} 秒）`);
      setBar(results.length/total*100);
      renderVideo(results);
      loadVideoHist();   // 每条入库后同步刷新「已入库记录」
    }
    if(files.length){
      for(let j=0;j<files.length;j++){
        const f = files[j];
        go.textContent = `处理中 ${results.length+1}/${total}…`;
        curT0 = Date.now();
        setV3(`<b>正在上传本地文件 ${j+1}/${files.length}</b><br>
          ⏱ 本条 <span id="vitem-t">0 秒</span> · 总用时 <span id="vtotal-t">0 秒</span><br>
          <span style="font-size:11px">${esc(f.name)}</span>${doneMsgs.length?('<br>'+doneMsgs.join('<br>')):''}`);
        const itemT0 = Date.now();
        const fd = new FormData();
        fd.append('file', f, f.name);
        const r = await fetch('/api/video/upload',{method:'POST',body:fd});
        const d = await r.json();
        results = results.concat(d.results || []);
        const last = results[results.length-1] || {};
        const secs = Math.round((Date.now()-itemT0)/1000);
        doneMsgs.unshift(last.ok
          ? `✅ 文件「${esc(f.name.slice(0,20))}」完成（${secs} 秒）`
          : `❌ 文件「${esc(f.name.slice(0,20))}」失败（${secs} 秒）`);
        setBar(results.length/total*100);
        renderVideo(results);
        loadVideoHist();   // 每条入库后同步刷新「已入库记录」
      }
    }
    const totalSecs = Math.round((Date.now()-t0)/1000);
    if(!results.length){ setV3('未提交任何链接或文件'); }
    else {
      setV3('🎉 全部完成：成功 '+(results.filter(x=>x.ok).length)+'/'+results.length+' 条（总用时 '+totalSecs+' 秒）<br>'+doneMsgs.join('<br>'));
      $('#v3sub').textContent = '完成';
    }
    setBar(100);
    renderVideo(results);
  }catch(e){ setV3('✗ '+e.message); }
  finally{ clearInterval(timerId); go.disabled=false; go.textContent='▶ 运行整理'; }
}
function renderVideo(list){
  const box = $('#vresult');
  const cnt = $('#vres-count');
  if(!list.length){ box.innerHTML='<div class="empty" style="padding:40px">批量整理的结果卡片会出现在这里。</div>'; cnt.style.display='none'; return; }
  _lastResults = list;
  cnt.style.display=''; cnt.textContent = '本次 '+list.length+' 条';
  const bar = list.length>1 ? `
    <div class="row" style="margin-bottom:10px">
      <b>整理结果（${list.length} 条）</b>
      <button class="btn" onclick="collapseAllV(true)">全部收起</button>
      <button class="btn" onclick="collapseAllV(false)">全部展开</button>
    </div>` : '';
  box.innerHTML = bar + list.map((x,idx)=>{
    const md = x.markdown || '';
    const ok = x.ok;
    const vp = (x.vault_path||'').replace(/\\/g,'/');
    const key = x.source_url || x.title || String(idx);
    const hid = _vCollapsed.has(key);
    return `<div class="vcard">
      <div class="vcard-h">
        <div>${esc(x.title||x.source_url)} ${ok?'':'<span style="color:var(--red)">✗ 失败</span>'}</div>
        <span style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          ${ok?'<span class="chip ok">✓ 已入库</span>':'<span class="chip err">失败</span>'}
          <button class="btn" onclick="toggleVCard(${idx})">${hid?'展开 ▼':'收起 ▲'}</button>
        </span>
      </div>
      <div class="vcard-b" id="vmd-${idx}" style="${hid?'display:none':''}">
        <div class="mut" style="margin-bottom:8px">${esc(x.source_url||'')} ${x.vault_path?('· 已入库: '+esc(vp)):'· 未入库'}</div>
        ${x.error?`<div style="color:var(--red);font-size:12px">${esc(x.error)}</div>`:''}
        <div class="md-body">${DOMPurify.sanitize(marked.parse(md))}</div>
      </div>
    </div>`;
  }).join('');
}
// 结果卡片收起/展开：用 Set 记状态，批量逐条重渲染时不丢
let _lastResults = [];
let _vCollapsed = new Set();
function _vkey(x, idx){ return (x && (x.source_url || x.title)) || String(idx); }
function toggleVCard(idx){
  const x = _lastResults[idx] || {};
  const md = document.getElementById('vmd-'+idx);
  if(!md) return;
  const hide = md.style.display !== 'none';
  md.style.display = hide ? 'none' : '';
  const btn = md.closest('.vcard').querySelector('.vcard-h button');
  if(btn) btn.textContent = hide ? '展开 ▼' : '收起 ▲';
  if(hide) _vCollapsed.add(_vkey(x, idx)); else _vCollapsed.delete(_vkey(x, idx));
}
function collapseAllV(hide){
  _lastResults.forEach((x,i)=>{
    const k = _vkey(x, i);
    if(hide) _vCollapsed.add(k); else _vCollapsed.delete(k);
  });
  renderVideo(_lastResults);
}
loadHist();
</script>
