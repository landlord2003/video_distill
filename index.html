<title>crawl4ai 本地采集器</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;
        --txt:#e6e9ef;--mut:#8b93a3;--acc:#4f9dff;--acc2:#2bd4a4;--red:#ff5f6e;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
  #app{display:flex;height:100vh}
  /* sidebar */
  #side{width:320px;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  #side h2{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);
           display:flex;align-items:center;gap:8px}
  #side h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
  #search{padding:10px 12px;border-bottom:1px solid var(--line)}
  #search input{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);
                border-radius:6px;color:var(--txt);outline:none}
  #search input:focus{border-color:var(--acc)}
  #hist{flex:1;overflow:auto}
  .item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:var(--panel2)}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .u{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m{color:var(--mut);font-size:11px;margin-top:3px;display:flex;justify-content:space-between}
  .item .st{font-size:11px}
  .st.done{color:var(--acc2)} .st.error{color:var(--red)} .st.running{color:var(--acc)}
  .empty{color:var(--mut);padding:20px;text-align:center}
  /* main */
  #main{flex:1;display:flex;flex-direction:column}
  #bar{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);
       display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #url{flex:1;min-width:260px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
       border-radius:8px;color:var(--txt);outline:none;font-size:14px}
  #url:focus{border-color:var(--acc)}
  #go{padding:10px 20px;background:var(--acc);color:#fff;border:none;border-radius:8px;
      cursor:pointer;font-weight:600}
  #go:disabled{opacity:.5;cursor:default}
  .toggle{display:flex;align-items:center;gap:6px;color:var(--mut);user-select:none}
  #status{padding:8px 18px;color:var(--mut);font-size:12px;min-height:18px}
  #result{flex:1;overflow:auto;padding:0 18px 18px}
  #rtitle{font-size:16px;font-weight:700;margin:10px 0 4px}
  #rmeta{color:var(--mut);font-size:12px;margin-bottom:10px}
  /* Markdown 渲染区 */
  #md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;
      line-height:1.7;font-size:14px}
  #md.md-raw{white-space:pre-wrap;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
            font-size:13px}
  .md-body>:first-child{margin-top:0}
  .md-body h1,.md-body h2,.md-body h3,.md-body h4{line-height:1.3;margin:1.1em 0 .5em;font-weight:700}
  .md-body h1{font-size:1.6em;border-bottom:1px solid var(--line);padding-bottom:.3em}
  .md-body h2{font-size:1.35em;border-bottom:1px solid var(--line);padding-bottom:.25em}
  .md-body h3{font-size:1.15em}
  .md-body p{margin:.7em 0}
  .md-body a{color:var(--acc);text-decoration:none}
  .md-body a:hover{text-decoration:underline}
  .md-body img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);
              margin:.3em 0;display:block}
  .md-body ul,.md-body ol{padding-left:1.6em;margin:.6em 0}
  .md-body li{margin:.25em 0}
  .md-body blockquote{margin:.7em 0;padding:.4em 1em;border-left:3px solid var(--acc);
                     color:var(--mut);background:var(--panel2)}
  .md-body code{background:var(--panel2);padding:.15em .4em;border-radius:4px;font-size:.9em;
               font-family:"SFMono-Regular",Consolas,monospace}
  .md-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;
              overflow:auto}
  .md-body pre code{background:none;padding:0}
  .md-body table{border-collapse:collapse;margin:.7em 0;width:100%}
  .md-body th,.md-body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .md-body hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}
  .md-body .nav-junk{opacity:.55;font-size:.85em}
  pre.json{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;
           overflow:auto;font-size:12px;color:var(--acc2)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;
       padding:5px 12px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--acc)}
  .btn.del{color:var(--red);border-color:transparent}
  .btn.del:hover{border-color:var(--red)}
  .delwrap{margin-top:6px;text-align:right}
  .row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);
           border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* tabs */
  #tabs{padding:10px 18px 0;display:flex;gap:8px}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--mut);
       border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;font-size:13px}
  .tab.active{background:var(--panel);color:var(--txt);border-bottom-color:var(--panel)}
  #video-panel{display:none;flex-direction:column;overflow:auto;padding:12px 18px 18px;flex:1}
  #vurls{width:100%;height:90px;background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;color:var(--txt);padding:10px;outline:none;resize:vertical;font-size:13px}
  #vurls:focus{border-color:var(--acc)}
  .vcard{padding:12px;border:1px solid var(--line);border-radius:8px;margin:12px 0}
  .vcard .mut{color:var(--mut);font-size:12px}
</style>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>

<div id="app" data-page-node-id="WxIPX7D7HoNwLgOpGdHmjn">

    <h2 data-page-node-id="135FHbU5rBQjqljfUsH0V3"><span class="dot" data-page-node-id="vPHHCIo0C73frckZzqrZAQ"></span>抓取历史</h2>
    <div id="search" data-page-node-id="azDHc0uAU3rR8x2UNsH0zw"><input id="q" placeholder="搜索 URL / 标题…" oninput="loadHist()" data-page-node-id="Zc6VMHuxnS6CAHWDmH5x7T"></div>
    <div id="hist" data-page-node-id="B0vQs9BvPRUWp8Uo9CjrvW"><div class="empty" data-page-node-id="a8gcfxytmFWB4bmkkeRnnc">暂无记录</div></div>

<script>
const $ = s => document.querySelector(s);
async function loadHist(){
  const q = $('#q').value.trim();
  const r = await fetch('/api/history?q='+encodeURIComponent(q));
  const rows = await r.json();
  const box = $('#hist');
  if(!rows.length){ box.innerHTML='<div class="empty">暂无记录</div>'; return; }
  box.innerHTML = rows.map(x=>`
    <div class="item" onclick="view('${x.id}')">
      <div class="t">${esc(x.title||x.url)}</div>
      <div class="u">${esc(x.url)}</div>
      <div class="m"><span class="st ${x.status}">${stxt(x.status)}</span>
        <span>${x.created_at||''} · ${x.md_len||0}字</span></div>
      <div class="delwrap"><button class="btn del" onclick="event.stopPropagation();del('${x.id}')">删除</button></div>
    </div>`).join('');
}
function stxt(s){return s==='done'?'✓ 完成':s==='error'?'✗ 失败':s==='running'?'… 进行中':'·'}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// 视频工具健康自检：确认当前服务加载的是新代码、yt-dlp/ffmpeg 可用
async function checkVideoHealth(){
  const el = document.getElementById('vhealth');
  if(!el) return;
  try{
    const r = await fetch('/api/video/health');
    const h = await r.json();
    const t = h.tools||{};
    const ok = x => x && x.ok ? '🟢' : '🔴';
    const yt = t.yt_dlp, ff = t.ffmpeg, fw = t.faster_whisper;
    el.innerHTML = `工具状态：${ok(yt)}yt-dlp ${ok(ff)}ffmpeg ${fw && fw.ok ? (fw.local_model ? '🟢转写就绪' : '🟡转写(模型待下载)') : '🔴'}`
      + (yt && !yt.ok ? ` <b style="color:#e06c75">yt-dlp 缺失，请重装依赖后重启服务</b>` : '')
      + (ff && !ff.ok ? ` <b style="color:#e06c75">ffmpeg 缺失</b>` : '');
  }catch(e){
    el.textContent = '工具状态：检测失败（服务未启动？）';
  }
}

async function crawl(){
  const url = $('#url').value.trim();
  if(!url){ setStatus('请先输入网址'); return; }
  const go = $('#go'); go.disabled=true; go.textContent='抓取中';
  setStatus('<span class="spinner"></span> 正在抓取 '+url+' …（首次启动浏览器约数秒）');
  try{
    const r = await fetch('/api/crawl',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url, use_llm:$('#llm').checked})});
    const d = await r.json();
    if(!r.ok){ setStatus('✗ 失败：'+(d.error||'未知错误')); renderErr(d); }
    else { render(d); setStatus('✓ 完成：'+d.md_len+' 字 Markdown 已存入历史'); }
  }catch(e){ setStatus('✗ 请求异常：'+e.message); }
  finally{ go.disabled=false; go.textContent='抓取'; loadHist(); }
}
function setStatus(h){ $('#status').innerHTML = h; }

let _currentMd = '';
let _rawView = false;
function render(d){
  _currentMd = d.markdown || '';
  _rawView = false;
  let h = `<div id="rtitle">${esc(d.title||d.url)}</div>
    <div id="rmeta">${esc(d.url)} · ${d.created_at||''} · ${(d.md_len||0)} 字
      <span style="margin-left:12px">${d.use_llm?'<span class="st done">含结构化抽取</span>':'<span class="mut">仅 Markdown</span>'}</span>
      <span style="margin-left:12px"><a class="btn" href="/api/crawls/${d.id}/download">下载 .md</a></span>
      <span style="margin-left:8px"><button class="btn" onclick="toggleRaw(this)">查看源码</button></span>
      <span style="margin-left:8px"><button class="btn del" onclick="del('${d.id}')">删除</button></span></div>`;
  h += `<div id="md" class="md-body"></div>`;
  if(d.extracted){
    h += `<div class="row" style="margin-top:14px"><b>结构化抽取结果</b></div>`;
    h += `<pre class="json">${esc(typeof d.extracted==='string'?d.extracted:JSON.stringify(d.extracted,null,2))}</pre>`;
  }
  if(d.error){ h += `<div class="row" style="margin-top:10px;color:var(--red)">错误：${esc(d.error)}</div>`; }
  $('#result').innerHTML = h;
  paintMd();
}
function paintMd(){
  const box = $('#md'); if(!box) return;
  if(_rawView){
    box.className = 'md-raw';
    box.textContent = _currentMd || '(空)';
  } else {
    box.className = 'md-body';
    const html = DOMPurify.sanitize(marked.parse(_currentMd || ''));
    box.innerHTML = html || '<span style="color:var(--mut)">(空)</span>';
  }
}
function toggleRaw(btn){
  _rawView = !_rawView;
  paintMd();
  if(btn) btn.textContent = _rawView ? '渲染视图' : '查看源码';
}
function renderErr(d){
  $('#result').innerHTML = `<div id="rtitle" style="color:var(--red)">抓取失败</div>
    <div id="rmeta">${esc(d.url||'')}</div>
    <pre class="json" style="color:var(--red)">${esc(d.error||'未知')}</pre>`;
}
async function view(id){
  setStatus('加载历史 '+id+' …');
  const r = await fetch('/api/crawls/'+id);
  const d = await r.json();
  if(!r.ok){ setStatus('✗ 未找到'); return; }
  render(d);
  $('#url').value = d.url||'';
  setStatus('✓ 已加载历史记录 '+id);
}
async function del(id){
  if(!confirm('确定删除这条抓取记录？关联文件（.md / .json）也会一并删除，不可恢复。')) return;
  setStatus('正在删除 '+id+' …');
  try{
    const r = await fetch('/api/crawls/'+id, {method:'DELETE'});
    if(r.ok){
      setStatus('✓ 已删除记录 '+id);
      loadHist();
      $('#result').innerHTML = '<div class="empty" style="color:var(--mut);padding:40px;text-align:center">记录已删除</div>';
    } else {
      const e = await r.json().catch(()=>({}));
      setStatus('✗ 删除失败：'+(e.error||r.status));
    }
  }catch(e){ setStatus('✗ 删除异常：'+e.message); }
}
function switchTab(t, btn){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const web = (t==='web');
  $('#bar').style.display = web?'flex':'none';
  $('#status').style.display = web?'block':'none';
  $('#result').style.display = web?'block':'none';
  $('#video-panel').style.display = web?'none':'flex';
  if(!web){ checkVideoHealth(); loadVideoHist(); }
}
// ---------- 已入库记录：查看 / 删除 ----------
async function loadVideoHist(){
  const box = $('#vhist'), st = $('#vhist-status');
  st.textContent = '加载中…';
  try{
    const r = await fetch('/api/video/history');
    const rows = await r.json();
    if(!rows.length){ box.innerHTML = '<div class="empty" style="padding:14px">暂无视频整理记录</div>'; st.textContent=''; return; }
    box.innerHTML = rows.map(x=>`
      <div class="item" style="cursor:default">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <div style="min-width:0">
            <div class="t">${esc(x.title||x.source_url)} <span class="st ${x.status}">${stxt(x.status)}</span></div>
            <div class="u">${esc(x.source_url||'')}</div>
            <div class="m"><span>${x.created_at||''} · ${x.md_len||0}字</span>
              <span style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((x.vault_path||'').replace(/\\\\/g,'/'))}</span></div>
          </div>
          <div style="flex-shrink:0;display:flex;gap:6px">
            <button class="btn" onclick="viewVideo('${x.id}')">查看</button>
            <button class="btn del" onclick="delVideo('${x.id}','${esc(x.title||x.id)}')">删除</button>
          </div>
        </div>
      </div>`).join('');
    st.textContent = '共 '+rows.length+' 条';
  }catch(e){ st.textContent = '加载失败：'+e.message; }
}
async function viewVideo(id){
  const st = $('#vhist-status');
  st.innerHTML = '<span class="spinner"></span> 加载笔记…';
  try{
    const r = await fetch('/api/video/records/'+id);
    if(!r.ok){ st.textContent = '✗ 记录不存在'; return; }
    const d = await r.json();
    $('#vresult').innerHTML = `<div class="vcard">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-weight:700;min-width:0">${esc(d.title||d.source_url)}</div>
        <button class="btn" style="flex-shrink:0" onclick="closeDetailView()">收起 ▲</button>
      </div>
      <div class="mut">${esc(d.source_url||'')} · ${d.created_at||''} · ${d.md_len||0}字
        ${d.vault_path?('· '+esc(d.vault_path.replace(/\\\\/g,'/'))):''}</div>
      ${d.error?`<div style="color:var(--red);font-size:12px">${esc(d.error)}</div>`:''}
      <div class="md-body" style="margin-top:8px">${DOMPurify.sanitize(marked.parse(d.markdown||'(笔记文件不存在或已被删除)'))}</div>
    </div>`;
    st.textContent = '✓ 已加载';
  }catch(e){ st.textContent = '✗ '+e.message; }
}
function closeDetailView(){
  $('#vresult').innerHTML = '';
  const st = $('#vhist-status'); if(st) st.textContent = '已收起详情';
}
async function delVideo(id, title){
  if(!confirm('确定删除记录「'+title+'」？\\n\\n将同时删除：数据库记录、知识库中的整理笔记（Claw/07-视频号整理）、服务端副本。\\n此操作不可恢复。')) return;
  const st = $('#vhist-status');
  st.innerHTML = '<span class="spinner"></span> 删除中…';
  try{
    const r = await fetch('/api/video/'+id, {method:'DELETE'});
    const d = await r.json();
    if(r.ok && d.ok){
      st.textContent = '✓ 已删除（含笔记 '+((d.removed||[]).length)+' 个文件）';
      loadVideoHist();
    } else { st.textContent = '✗ 删除失败：'+(d.error||r.status); }
  }catch(e){ st.textContent = '✗ '+e.message; }
}

// ---------- 抖音主页采集：清单先行，人工过目后再入库 ----------
let _profileVideos = [];
async function collectProfile(){
  const url = $('#vprofile').value.trim();
  if(!url){ $('#vstatus').textContent = '请先粘贴抖音用户主页链接'; return; }
  const btn = $('#vpg'); btn.disabled = true; btn.textContent = '采集中…';
  $('#vplist').innerHTML = '<div class="empty" style="padding:14px">正在打开主页并滚动采集清单，约需 1~3 分钟…</div>';
  $('#vstatus').textContent = '';
  try{
    const r = await fetch('/api/video/profile',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url, max_count:parseInt($('#vpcount').value,10)})});
    const d = await r.json();
    if(!r.ok){
      $('#vplist').innerHTML = `<div class="vcard" style="border-color:var(--red)">✗ 采集失败：${esc(d.error||r.status)}</div>`;
      return;
    }
    _profileVideos = d.videos || [];
    renderProfileList(d.nickname || '');
    $('#vstatus').textContent = `✓ 采集到 ${_profileVideos.length} 条视频，勾选后「填入下方清单」再运行整理`;
  }catch(e){
    $('#vplist').innerHTML = `<div class="vcard" style="border-color:var(--red)">✗ 请求异常：${esc(e.message)}</div>`;
  }finally{ btn.disabled = false; btn.textContent = '🔍 采集该抖音号'; }
}
function renderProfileList(nickname){
  const box = $('#vplist');
  if(!_profileVideos.length){ box.innerHTML=''; return; }
  const rows = _profileVideos.map((v,i)=>`
    <label style="display:flex;gap:8px;align-items:center;padding:5px 2px;border-bottom:1px dashed var(--line);cursor:pointer">
      <input type="checkbox" class="vp-chk" data-i="${i}" checked>
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(v.title)}">${esc(v.title.slice(0,60))}</span>
      <span class="mut" style="flex-shrink:0;font-size:11px">${v.id}</span>
    </label>`).join('');
  box.innerHTML = `<div class="vcard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <b>📋 采集清单${nickname?('：'+esc(nickname)):''}（${_profileVideos.length} 条）</b>
      <span style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn" onclick="vpSelAll(true)">全选</button>
        <button class="btn" onclick="vpSelAll(false)">全不选</button>
        <button class="btn" onclick="vpFill()">把选中链接填入上方清单</button>
      </span>
    </div>
    <div style="margin-top:6px;max-height:260px;overflow:auto">${rows}</div>
  </div>`;
}
function vpSelAll(on){
  document.querySelectorAll('.vp-chk').forEach(c=>c.checked=on);
}
function vpFill(){
  const sel = [...document.querySelectorAll('.vp-chk')].filter(c=>c.checked)
    .map(c=>_profileVideos[+c.dataset.i].url);
  if(!sel.length){ $('#vstatus').textContent = '未勾选任何视频'; return; }
  $('#vurls').value = sel.join('\n');
  $('#vstatus').textContent = `✓ 已填入 ${sel.length} 条链接，点「运行整理」开始批量下载蒸馏`;
  $('#vurls').scrollIntoView({behavior:'smooth', block:'center'});
}

async function runVideo(){
  const urls = $('#vurls').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const files = $('#vfiles').files;
  const wv = $('#vvault').checked;
  const go = $('#vgo'); go.disabled=true; go.textContent='处理中…';
  let results = [];
  const total = urls.length + files.length;
  const t0 = Date.now();
  // 每秒刷新一次用时显示
  const timerId = setInterval(()=>{
    const el = document.getElementById('vtimer');
    if(el) el.textContent = Math.round((Date.now()-t0)/1000) + ' 秒';
  }, 1000);
  const doneMsgs = [];
  try{
    // 逐条提交：每条链接一个请求，处理完立即渲染。
    // 好处：① 单条卡住/失败不影响其余；② 页面能看到第几条在处理；③ 服务端逐条入库。
    for(let i=0;i<urls.length;i++){
      go.textContent = `处理中 ${results.length+1}/${total}…`;
      $('#vstatus').innerHTML = `<span class="spinner"></span> <b>正在处理第 ${i+1}/${urls.length} 条链接</b>（已用时 <span id="vtimer">0 秒</span>）<br><span style="font-size:11px">${esc(urls[i].slice(0,70))}</span>${doneMsgs.length?('<br>'+doneMsgs.join('<br>')):''}`;
      const itemT0 = Date.now();
      try{
        const r = await fetch('/api/video',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({urls:[urls[i]], write_vault:wv})});
        const d = await r.json();
        results = results.concat(d.results || []);
      }catch(err){
        results.push({source_url:urls[i], ok:false, error:'请求失败: '+err.message, markdown:''});
      }
      const last = results[results.length-1] || {};
      const secs = Math.round((Date.now()-itemT0)/1000);
      doneMsgs.unshift(last.ok
        ? `✅ 第 ${i+1} 条完成（${secs} 秒）：${esc((last.title||'').slice(0,30))}`
        : `❌ 第 ${i+1} 条失败（${secs} 秒）`);
      renderVideo(results);
    }
    if(files.length){
      for(let j=0;j<files.length;j++){
        const f = files[j];
        go.textContent = `处理中 ${results.length+1}/${total}…`;
        $('#vstatus').innerHTML = `<span class="spinner"></span> <b>正在上传本地文件 ${j+1}/${files.length}</b>（已用时 <span id="vtimer">0 秒</span>）<br><span style="font-size:11px">${esc(f.name)}</span>${doneMsgs.length?('<br>'+doneMsgs.join('<br>')):''}`;
        const itemT0 = Date.now();
        const fd = new FormData();
        fd.append('file', f, f.name);
        const r = await fetch('/api/video/upload',{method:'POST',body:fd});
        const d = await r.json();
        results = results.concat(d.results || []);
        const last = results[results.length-1] || {};
        const secs = Math.round((Date.now()-itemT0)/1000);
        doneMsgs.unshift(last.ok
          ? `✅ 文件「${esc(f.name.slice(0,20))}」完成（${secs} 秒）`
          : `❌ 文件「${esc(f.name.slice(0,20))}」失败（${secs} 秒）`);
        renderVideo(results);
      }
    }
    const totalSecs = Math.round((Date.now()-t0)/1000);
    if(!results.length){ $('#vstatus').textContent='未提交任何链接或文件'; }
    else { $('#vstatus').innerHTML = '🎉 全部完成：成功 '+(results.filter(x=>x.ok).length)+'/'+results.length+' 条（总用时 '+totalSecs+' 秒）'; }
    renderVideo(results);
  }catch(e){ $('#vstatus').textContent='✗ '+e.message; }
  finally{ clearInterval(timerId); go.disabled=false; go.textContent='运行整理'; }
}
function renderVideo(list){
  const box = $('#vresult');
  if(!list.length){ box.innerHTML=''; return; }
  _lastResults = list;
  const bar = list.length>1 ? `
    <div class="row" style="margin-bottom:8px">
      <b>整理结果（${list.length} 条）</b>
      <button class="btn" onclick="collapseAllV(true)">全部收起</button>
      <button class="btn" onclick="collapseAllV(false)">全部展开</button>
    </div>` : '';
  box.innerHTML = bar + list.map((x,idx)=>{
    const md = x.markdown || '';
    const ok = x.ok;
    const vp = (x.vault_path||'').replace(/\\/g,'/');
    const key = x.source_url || x.title || String(idx);
    const hid = _vCollapsed.has(key);
    return `<div class="vcard">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title||x.source_url)} ${ok?'':'<span style="color:var(--red)">✗ 失败</span>'}</div>
        <button class="btn" style="flex-shrink:0" onclick="toggleVCard(${idx})">${hid?'展开 ▼':'收起 ▲'}</button>
      </div>
      <div class="mut">${esc(x.source_url||'')} ${x.vault_path?('· 已入库: '+esc(vp)):'· 未入库'}</div>
      ${x.error?`<div style="color:var(--red);font-size:12px">${esc(x.error)}</div>`:''}
      <div class="md-body" id="vmd-${idx}" style="margin-top:8px;${hid?'display:none':''}">${DOMPurify.sanitize(marked.parse(md))}</div>
    </div>`;
  }).join('');
}
// 结果卡片收起/展开：用 Set 记状态，批量逐条重渲染时不丢
let _lastResults = [];
let _vCollapsed = new Set();
function _vkey(x, idx){ return (x && (x.source_url || x.title)) || String(idx); }
function toggleVCard(idx){
  const x = _lastResults[idx] || {};
  const md = document.getElementById('vmd-'+idx);
  if(!md) return;
  const hide = md.style.display !== 'none';
  md.style.display = hide ? 'none' : '';
  const btn = md.closest('.vcard').querySelector('button');
  if(btn) btn.textContent = hide ? '展开 ▼' : '收起 ▲';
  if(hide) _vCollapsed.add(_vkey(x, idx)); else _vCollapsed.delete(_vkey(x, idx));
}
function collapseAllV(hide){
  _lastResults.forEach((x,i)=>{
    const k = _vkey(x, i);
    if(hide) _vCollapsed.add(k); else _vCollapsed.delete(k);
  });
  renderVideo(_lastResults);
}
loadHist();
</script>
